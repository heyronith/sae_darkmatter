[project]
name = "saedm"
version = "0.1.0"
description = "SAE dark matter & memorization study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "pyyaml",
    "numpy",
    "pandas",
    "wandb",
    "scipy>=1.17.1",
    "requests>=2.34.2",
    "pyarrow>=26.0.0",
    "huggingface-hub>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "modal>=1.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saedm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that need network or model downloads (deselected by default)",
]
addopts = "-m 'not slow'"
